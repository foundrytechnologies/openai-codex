name: mithril-release

on:
  push:
    tags: ["mithril-v*"]

permissions:
  contents: read

concurrency:
  group: mithril-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'foundrytechnologies/openai-codex'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    container:
      image: rust:1.95-bookworm@sha256:6258907abe69656e41cd992e0b705cdcfabcbbe3db374f92ed2d47121282d4a1
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
      CARGO_PROFILE_RELEASE_STRIP: symbols
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends clang cmake libclang-dev libssl-dev libasound2-dev libcap-dev pkg-config protobuf-compiler lld python3
      - name: Check release identity
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_TARGET"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "mithril-v$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          fi
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: mithril-cargo-${{ runner.arch }}-${{ hashFiles('codex-rs/Cargo.lock') }}
      - name: Build CLI
        working-directory: codex-rs
        run: cargo build --release --locked -p codex-cli --bin codex
      - name: Package complete runtime
        env:
          RUNTIME_TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/mithril_release.py package --binary codex-rs/target/release/codex --target "$RUNTIME_TARGET" --revision "$(git rev-parse HEAD)" --output dist
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-mithril-${{ matrix.target }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    container:
      image: python:3.12-slim-bookworm@sha256:6a0e06f5ba0b373d051aabd3fffb9b873f27f9a2a3a14bcbe37dee6f0e3bbc70
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-mithril-${{ matrix.target }}
          path: dist
      - name: Verify SDK startup on Debian 12
        env:
          RUNTIME_TARGET: ${{ matrix.target }}
        run: |
          python3 -m pip install --no-cache-dir openai-codex==0.160.1
          mkdir runtime
          tar -xzf "dist/codex-mithril-${RUNTIME_TARGET}.tar.gz" -C runtime
          python3 scripts/mithril_runtime_smoke.py runtime

  publish:
    needs: [build, smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-mithril-*
          merge-multiple: true
          path: dist
      - name: Publish verified archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/mithril_release.py manifest --input dist --revision "$(git rev-parse HEAD)" --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
          (cd dist && sha256sum --check SHA256SUMS)
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "Codex ${RELEASE_TAG#mithril-v}" --notes "Mithril runtime based on Codex 0.160.1. Includes flat MCP tools, pinned upstream helpers, SHA256SUMS, and release.json for consumers."
